name: Check and publish status

on:
  schedule:
    # GitHub may delay scheduled runs at busy times; the page warns when checks are stale.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run checks and rebuild incidents
        run: python3 scripts/check.py

      - name: Commit results
        run: |
          git config user.name "maritime-status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add data feed.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "status: checks $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || { git rebase --abort; git fetch origin main; git reset --soft origin/main; python3 scripts/check.py --no-check; git add data feed.xml; git commit -m "status: rebuild after concurrent push"; }
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
