name: Check and publish status

on:
  schedule:
    # GitHub may delay scheduled runs at busy times; the page warns when checks are stale.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run checks and rebuild incidents
        env:
          TRANSITIONS_FILE: ${{ runner.temp }}/transitions.tsv
        run: python3 scripts/check.py

      - name: Alert the team on outages
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSITIONS_FILE: ${{ runner.temp }}/transitions.tsv
        run: |
          [ -s "$TRANSITIONS_FILE" ] || exit 0
          gh label create outage --color d64545 --description "Automatic outage alert" 2>/dev/null || true
          while IFS=$'\t' read -r id name old new error; do
            title="Outage: $name ($id)"
            open=$(gh issue list --label outage --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ "$new" = "outage" ] && [ -z "$open" ]; then
              gh issue create --label outage --title "$title" --body "Automatic check: **$name** went from $old to outage at $(date -u +%H:%MZ) ($error).

          @mariagorskikh @aryshriv @bli0428 please confirm, and if customers are affected post an incident (incidents/_template.md) and email them. This issue closes itself when the check recovers."
            elif [ "$old" = "outage" ] && [ -n "$open" ]; then
              gh issue close "$open" --comment "Automatic check: $name is $new again at $(date -u +%H:%MZ)."
            fi
          done < "$TRANSITIONS_FILE"

      - name: Commit results
        run: |
          git config user.name "maritime-status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add data feed.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "status: checks $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || { git rebase --abort; git fetch origin main; git reset --soft origin/main; python3 scripts/check.py --no-check; git add data feed.xml; git commit -m "status: rebuild after concurrent push"; }
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
