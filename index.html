<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maritime Status</title>
<meta name="description" content="Live status of Maritime: website and dashboard, API, agents and computers, and MCP.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="alternate" type="application/atom+xml" title="Maritime status incidents" href="feed.xml">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #6b6b6b;
    --line: #ececec;
    --card: #ffffff;
    --ok: #1f9d55;
    --warn: #d69e2e;
    --down: #d64545;
    --maint: #3b6fd6;
    --none: #e4e4e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 36px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 17px; }
  .brand img { height: 28px; width: auto; }
  .brand span.sub { color: var(--muted); font-weight: 400; }
  header nav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-left: 16px; }
  header nav a:hover { color: var(--text); }
  .banner { border-radius: 10px; padding: 18px 20px; color: #fff; font-weight: 600; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .banner small { font-weight: 400; font-size: 13px; opacity: .9; }
  .banner.operational { background: var(--ok); }
  .banner.degraded { background: var(--warn); }
  .banner.outage { background: var(--down); }
  .banner.maintenance { background: var(--maint); }
  .banner.loading { background: #9a9a9a; }
  .notice { margin-top: 12px; font-size: 13px; color: var(--muted); }
  h2 { font-size: 15px; font-weight: 600; margin: 40px 0 12px; }
  .components { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .component { padding: 16px 20px; border-top: 1px solid var(--line); }
  .component:first-child { border-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { font-weight: 500; }
  .state { font-size: 14px; font-weight: 500; }
  .state.operational { color: var(--ok); }
  .state.degraded { color: var(--warn); }
  .state.outage { color: var(--down); }
  .state.maintenance { color: var(--maint); }
  .bars { display: flex; gap: 2px; margin: 10px 0 6px; height: 30px; }
  .bars span { flex: 1; border-radius: 2px; background: var(--none); min-width: 2px; }
  .bars span.operational { background: var(--ok); }
  .bars span.degraded { background: var(--warn); }
  .bars span.outage { background: var(--down); }
  .bars span.maintenance { background: var(--maint); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .incident { border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
  .incident h3 { margin: 0 0 4px; font-size: 15px; }
  .incident .when { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .incident p { margin: 8px 0 0; }
  .incident code { font-size: 13px; background: #f4f4f4; padding: 1px 4px; border-radius: 4px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; color: #fff; }
  .pill.resolved { background: #8a8a8a; }
  .pill.open { background: var(--down); }
  .pill.open.degraded { background: var(--warn); }
  .pill.open.maintenance { background: var(--maint); }
  .empty { color: var(--muted); font-size: 14px; }
  a { color: inherit; }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  footer a { color: var(--muted); }
  @media (max-width: 520px) {
    main { padding-top: 24px; }
    .bars { height: 24px; gap: 1px; }
    header nav a { margin-left: 10px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="https://maritime.sh"><img src="assets/logo.png" alt="Maritime"><span>Maritime <span class="sub">Status</span></span></a>
    <nav><a href="feed.xml">Subscribe (RSS)</a><a href="https://maritime.sh">maritime.sh</a></nav>
  </header>

  <div id="banner" class="banner loading">Checking status...</div>
  <div id="notice" class="notice"></div>

  <div id="active"></div>

  <h2>Components</h2>
  <div id="components" class="components"></div>

  <h2>Incident history</h2>
  <div id="history"></div>

  <footer>
    Checked automatically every 5 minutes from outside Maritime's own infrastructure. Times are shown in your local time zone.
    Seeing a problem that is not listed here? Email <a href="mailto:contact@maritime.sh">contact@maritime.sh</a>.
  </footer>
</main>
<script>
(function () {
  var RANK = { operational: 0, maintenance: 1, degraded: 2, outage: 3 };
  var LABEL = { operational: "Operational", degraded: "Degraded performance", outage: "Outage", maintenance: "Maintenance" };
  var BANNER = {
    operational: "All systems operational",
    degraded: "Some systems are degraded",
    outage: "Some systems are down",
    maintenance: "Maintenance in progress"
  };
  var OPEN = { investigating: 1, identified: 1, monitoring: 1 };

  function worst(a, b) { return RANK[b] > RANK[a] ? b : a; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(isoStr) {
    var d = new Date(isoStr);
    if (isNaN(d)) return isoStr;
    return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
  }
  function ago(isoStr) {
    var mins = Math.round((Date.now() - new Date(isoStr).getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    var h = Math.round(mins / 60);
    return h + (h === 1 ? " hour ago" : " hours ago");
  }
  function dayKey(d) { return d.toISOString().slice(0, 10); }
  function load(path) {
    return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(path + " " + r.status);
      return r.json();
    });
  }

  Promise.all([load("config.json"), load("data/status.json"), load("data/incidents.json")])
    .then(function (res) { render(res[0], res[1], res[2]); })
    .catch(function (err) {
      var b = document.getElementById("banner");
      b.className = "banner loading";
      b.textContent = "Status data could not be loaded. Please refresh.";
      console.error(err);
    });

  function render(config, state, incidents) {
    var days = config.history_days || 90;
    var open = incidents.filter(function (i) { return OPEN[i.status]; });

    // Days touched by each incident, per component, for the uptime bars.
    var incidentDays = {};
    incidents.forEach(function (i) {
      var start = new Date(i.started);
      var end = i.resolved ? new Date(i.resolved) : new Date();
      for (var d = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate())); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
        var k = dayKey(d);
        i.components.forEach(function (c) {
          incidentDays[c] = incidentDays[c] || {};
          incidentDays[c][k] = worst(incidentDays[c][k] || "operational", i.impact);
        });
      }
    });

    var overall = "operational";
    var list = document.getElementById("components");
    var trackingStart = null;
    Object.keys(state.daily || {}).forEach(function (id) {
      Object.keys(state.daily[id]).forEach(function (k) { if (!trackingStart || k < trackingStart) trackingStart = k; });
    });

    config.components.forEach(function (comp) {
      var status = "operational";
      var check = (state.checks || {})[comp.id];
      if (comp.url && check) status = check.status;
      open.forEach(function (i) { if (i.components.indexOf(comp.id) >= 0) status = worst(status, i.impact); });
      overall = worst(overall, status);

      var box = el("div", "component");
      var row = el("div", "row");
      row.appendChild(el("div", "name", comp.name));
      row.appendChild(el("div", "state " + status, LABEL[status]));
      box.appendChild(row);

      var bars = el("div", "bars");
      var daily = (state.daily || {})[comp.id] || {};
      var up = 0, total = 0;
      var today = new Date();
      for (var n = days - 1; n >= 0; n--) {
        var d = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - n));
        var k = dayKey(d);
        var cls = "", tip = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ": ";
        var counts = daily[k];
        var inc = (incidentDays[comp.id] || {})[k];
        if (counts && counts[1] > 0) {
          up += counts[0]; total += counts[1];
          var pct = counts[0] / counts[1] * 100;
          cls = pct >= 99.5 ? "operational" : pct >= 95 ? "degraded" : "outage";
          tip += pct.toFixed(2) + "% up (" + counts[1] + " checks)";
        } else if (!comp.url && trackingStart && k >= trackingStart) {
          cls = "operational";
          tip += "No incidents";
        } else {
          tip += "No data";
        }
        if (inc && inc !== "operational") {
          cls = cls ? worst(cls, inc) : inc;
          tip += ", incident reported";
        }
        var s = el("span", cls);
        s.title = tip;
        bars.appendChild(s);
      }
      box.appendChild(bars);

      var meta = el("div", "meta");
      meta.appendChild(el("span", null, days + " days ago"));
      if (comp.url) {
        meta.appendChild(el("span", null, total ? (up / total * 100).toFixed(2) + "% uptime" : "Collecting data"));
      } else {
        meta.appendChild(el("span", null, comp.note || "Updated manually"));
      }
      meta.appendChild(el("span", null, "Today"));
      box.appendChild(meta);
      list.appendChild(box);
    });

    var banner = document.getElementById("banner");
    banner.className = "banner " + overall;
    banner.textContent = "";
    banner.appendChild(document.createTextNode(BANNER[overall]));
    if (state.last_run) banner.appendChild(el("small", null, "Last checked " + ago(state.last_run)));
    if (state.last_run && Date.now() - new Date(state.last_run).getTime() > 45 * 60000) {
      document.getElementById("notice").textContent =
        "Automatic checks have not run since " + fmt(state.last_run) + ". The status above may be out of date.";
    }

    var active = document.getElementById("active");
    if (open.length) {
      active.appendChild(el("h2", null, "Active incidents"));
      open.forEach(function (i) { active.appendChild(incidentCard(i, config)); });
    }

    var history = document.getElementById("history");
    var cutoff = Date.now() - days * 86400000;
    var past = incidents.filter(function (i) { return !OPEN[i.status] && new Date(i.started).getTime() >= cutoff; });
    if (!past.length) {
      history.appendChild(el("p", "empty", "No incidents reported in the last " + days + " days."));
    } else {
      past.forEach(function (i) { history.appendChild(incidentCard(i, config)); });
    }
    if (location.hash) {
      var target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
  }

  function incidentCard(i, config) {
    var names = {};
    config.components.forEach(function (c) { names[c.id] = c.name; });
    var card = el("div", "incident");
    card.id = i.id;
    var h = el("h3", null, i.title);
    var isOpen = !!OPEN[i.status];
    var pill = el("span", "pill " + (isOpen ? "open " + i.impact : "resolved"), i.status.charAt(0).toUpperCase() + i.status.slice(1));
    h.appendChild(pill);
    card.appendChild(h);
    var when = fmt(i.started) + (i.resolved ? " to " + fmt(i.resolved) : "");
    if (i.components.length) when += " · " + i.components.map(function (c) { return names[c] || c; }).join(", ");
    card.appendChild(el("div", "when", when));
    var body = el("div");
    body.innerHTML = i.html; // built from our own incidents/*.md files, HTML-escaped by scripts/check.py
    card.appendChild(body);
    return card;
  }
})();
</script>
</body>
</html>
